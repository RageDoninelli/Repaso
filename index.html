<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142f39"><meta name="description" content="Repaso tranquilo de italiano B1 con práctica ilimitada."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Il mio Caffè Italiano · B1</title><style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#172d35;--sub:#50636a;--accent:#126b70;--line:#d7dfdd;--focus:#efad4e;--size:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--size)/1.55 system-ui,-apple-system,Segoe UI,sans-serif}body.dark{--bg:#102127;--card:#1a3139;--ink:#f5f6f2;--sub:#cad6d5;--accent:#80d9cf;--line:#52666a}body.high{--bg:#000;--card:#000;--ink:#fff;--sub:#fff;--accent:#ffea00;--line:#fff}button,select{font:inherit}button{cursor:pointer;border-radius:16px;border:2px solid var(--line);padding:15px 17px;background:var(--card);color:var(--ink);min-height:54px;text-align:left}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:750;text-align:center}button:focus-visible,select:focus-visible{outline:4px solid var(--focus);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:800px;margin:auto;padding:20px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:1.1em;font-weight:800}.tiny{font-size:.75em;color:var(--sub)}h1{font-size:1.55em;line-height:1.25;margin:10px 0}h2{font-size:1.2em;line-height:1.35;margin:8px 0}p{margin:9px 0}.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.muted{color:var(--sub)}.dedica{font-weight:700;line-height:1.55;border-left:5px solid var(--accent);padding:10px 14px;margin:18px 0}.passage{white-space:pre-line;background:var(--bg);padding:16px;border:2px solid var(--line);border-radius:14px;line-height:1.7;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid button{height:100%;font-weight:650}.unit{display:block;width:100%;margin:10px 0}.unit span{display:block;font-size:.77em;font-weight:400;color:var(--sub)}.pill{display:inline-block;border:1px solid var(--line);padding:4px 11px;border-radius:99px;font-size:.72em}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.actions>*{flex:1 1 150px}.choices{display:grid;gap:12px;margin:22px 0}.choice{width:100%;text-align:left;min-height:68px}.choice.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}.choice:disabled{opacity:1}.feedback{border-left:6px solid var(--accent);background:var(--bg);padding:14px 16px;border-radius:10px;margin-top:16px}.rule{border-bottom:1px solid var(--line);padding:14px 0}.rule:last-child{border:0}.example{font-style:italic;font-weight:650}.progress{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--accent)}.settings label{display:block;margin:13px 0 5px;font-weight:650}.settings select{padding:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;width:100%}.footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:3}.footer button{font-size:.78em;padding:8px 14px;min-height:48px;text-align:center}.hidden{display:none!important}@media(max-width:380px){.grid{grid-template-columns:1fr}.wrap{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .1s}}@media print{.footer,.top button{display:none}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">☕ Il mio Caffè Italiano <span class="tiny">B1</span></div><button onclick="navigate('settings')" aria-label="Ajustes de accesibilidad">⚙️</button></div><div id="app" aria-live="polite"></div></main><nav class="footer" aria-label="Navegación"><button onclick="navigate('home')">⌂ Inicio</button><button onclick="navigate('units')">📖 Unidades</button><button onclick="startSession('mixed')">↻ Repetir</button></nav><script src="data.js"></script><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'home',unit:0,mode:'unit',pool:[],index:0,selected:-1,checked:false,sessionDone:0};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let prefs=load('caffe-prefs',{size:22,theme:'light'}),stats=load('caffe-stats',{seen:{},saved:[],attempts:0});
function applyPrefs(){document.documentElement.style.setProperty('--size',prefs.size+'px');document.body.className=prefs.theme==='dark'?'dark':prefs.theme==='high'?'high':'';}applyPrefs();
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function navigate(page,u){state.page=page;if(u!==undefined)state.unit=u;render();window.scrollTo(0,0)}
function startSession(mode,u){state.mode=mode;state.unit=u??state.unit;let ids=Q.map((q,i)=>({q,i})).filter(({q,i})=>mode==='mixed'||(mode==='saved'?stats.saved.includes(i):q.u===state.unit)).map(x=>x.i);if(!ids.length){navigate('home');return}state.pool=shuffle(ids);state.index=0;state.selected=-1;state.checked=false;state.sessionDone=0;state.page='practice';render();window.scrollTo(0,0)}
function current(){return Q[state.pool[state.index]]}
function speak(text){if(!('speechSynthesis' in window)){alert('La lectura en voz alta no está disponible en este navegador.');return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='it-IT';utter.rate=.83;speechSynthesis.speak(utter)}
function saveQuestion(){const id=state.pool[state.index];stats.saved=stats.saved.includes(id)?stats.saved.filter(x=>x!==id):[...stats.saved,id];store('caffe-stats',stats);render()}
function select(i){if(state.checked)return;state.selected=i;render()}
function check(){if(state.selected<0)return;state.checked=true;let id=state.pool[state.index],q=current();stats.attempts++;stats.seen[id]=(stats.seen[id]||0)+1;if(state.selected!==q.answer&&!stats.saved.includes(id))stats.saved.push(id);store('caffe-stats',stats);render()}
function next(){state.index++;state.selected=-1;state.checked=false;state.sessionDone++;if(state.index>=state.pool.length){state.pool=shuffle(state.pool);state.index=0}render();window.scrollTo(0,0)}
function render(){let h='';if(state.page==='home'){h=`<section class="card"><span class="pill">Ripasso completo · 10 unità</span><h1>Ciao! Pronta per esercitarti, cusi?</h1><p class="dedica">Jamás olvides que te amo mucho y que estoy orgulloso de ti.</p><p>Practica a tu ritmo. Sin notas, sin cronómetro y con todas las repeticiones que quieras.</p><p class="muted">${Q.length} actividades originales disponibles en esta versión.</p><div class="actions"><button class="primary" onclick="navigate('units')">Elegir una unidad</button><button onclick="startSession('mixed')">Practicar todo el libro</button></div></section><div class="grid"><button onclick="navigate('units')">📖<br>Le 10 unità<br><small class="muted">Reglas y práctica</small></button><button onclick="startSession('mixed')">🔄<br>Pratica mista<br><small class="muted">Mezcla ilimitada</small></button><button onclick="startSession('saved')" ${!stats.saved.length?'disabled':''}>💛<br>Da rivedere<br><small class="muted">${stats.saved.length} preguntas guardadas</small></button><button onclick="navigate('settings')">🔎<br>Accessibilità<br><small class="muted">Letra y contraste</small></button></div><p class="muted tiny">Se han registrado ${stats.attempts} respuestas en este dispositivo. No hay puntuaciones obligatorias.</p>`}
if(state.page==='units'){h=`<h1>Le dieci unità</h1><p class="muted">Puedes entrar en cualquier unidad. No hay bloqueos.</p>`+UNITS.map((u,i)=>`<button class="unit" onclick="navigate('unit',${i})"><strong>${i+1}. ${esc(u.title)}</strong><span>${esc(u.topic)} · ${Q.filter(q=>q.u===i).length} actividades</span></button>`).join('')}
if(state.page==='unit'){let u=UNITS[state.unit];h=`<button onclick="navigate('units')">← Todas las unidades</button><div class="card"><span class="pill">Unità ${state.unit+1}</span><h1>${esc(u.title)}</h1><p class="muted">${esc(u.topic)}</p><div class="actions"><button class="primary" onclick="startSession('unit',${state.unit})">Comenzar práctica (${Q.filter(q=>q.u===state.unit).length})</button></div></div><h2>Le regole, con calma</h2>`+u.rules.map(r=>`<section class="card rule"><h2>${esc(r[0])}</h2><p>${esc(r[1])}</p><p class="example" lang="it">${esc(r[2])}</p><button onclick="speak(decodeURIComponent('${encodeURIComponent(r[2])}'))">🔊 Escuchar ejemplo</button></section>`).join('')}
if(state.page==='practice'){let q=current(),id=state.pool[state.index],saved=stats.saved.includes(id),ok=state.selected===q.answer;h=`<button onclick="navigate('unit',${q.u})">← Salir de la práctica</button><section class="card"><span class="pill">Unità ${q.u+1} · ${esc(q.tag)}</span><p class="muted">Práctica sin límite · ${state.sessionDone+1} preguntas vistas en esta ronda</p><h1 lang="it">${esc(q.stem)}</h1>${q.passage?`<div class="passage" lang="it">${esc(q.passage)}</div>`:""}<button onclick="speak(decodeURIComponent('${encodeURIComponent((q.passage?q.passage+". ":"")+q.stem)}'))">🔊 Escuchar</button><div class="choices">${q.options.map((opt,i)=>`<button lang="it" class="choice ${state.selected===i?'selected':''}" ${state.checked?'disabled':''} onclick="select(${i})">${state.selected===i?'●':'○'} &nbsp;${esc(opt)}</button>`).join('')}</div>${state.checked?`<div class="feedback" role="status"><strong>${ok?'Bravissima! 🌼':'Riproviamo insieme 🌷'}</strong><p>Respuesta: <strong lang="it">${esc(q.options[q.answer])}</strong></p><p>${esc(q.explain)}</p></div>`:''}<div class="actions">${!state.checked?`<button class="primary" onclick="check()" ${state.selected<0?'disabled':''}>Verifica</button>`:`<button class="primary" onclick="next()">Siguiente ejercicio →</button><button onclick="state.checked=false;state.selected=-1;render()">↻ Intentar otra vez</button>`}<button onclick="saveQuestion()">${saved?'♥ Quitar de repaso':'♡ Guardar para repasar'}</button></div></section><p class="tiny muted">Si terminas las preguntas disponibles, volverán a aparecer en un orden nuevo. Puedes repetirlas tantas veces como quieras.</p>`}
if(state.page==='settings'){h=`<h1>Accessibilità</h1><div class="card settings"><label for="size">Tamaño de letra: ${prefs.size}px</label><input id="size" type="range" min="18" max="34" step="2" value="${prefs.size}" style="width:100%;min-height:46px" oninput="prefs.size=Number(this.value);store('caffe-prefs',prefs);applyPrefs();document.querySelector('label[for=size]').textContent='Tamaño de letra: '+prefs.size+'px'"><label for="theme">Contraste y colores</label><select id="theme" onchange="prefs.theme=this.value;store('caffe-prefs',prefs);applyPrefs()"><option value="light" ${prefs.theme==='light'?'selected':''}>Claro</option><option value="dark" ${prefs.theme==='dark'?'selected':''}>Oscuro</option><option value="high" ${prefs.theme==='high'?'selected':''}>Alto contraste</option></select><p>Los ajustes se guardan en este dispositivo.</p><button onclick="speak('Ciao! Oggi studiamo italiano con calma.')">🔊 Probar lectura en italiano</button></div><p class="tiny muted">La voz depende de las voces instaladas en Android. Si no hay voz italiana, la pronunciación puede variar.</p>`}
$('#app').innerHTML=h}
render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
